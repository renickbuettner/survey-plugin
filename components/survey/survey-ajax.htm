{% if this.result %}
    <div class="card-body text-white {{ __SELF__.isSuccess ? 'bg-success' : 'bg-danger' }}">
        {% if __SELF__.error %}
            <span class="error">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ __SELF__.error }}
            </span>
        {% endif %}

        {% if __SELF__.feedback %}
            {{ __SELF__.feedback }}
        {% endif %}
    </div>

    {% if __SELF__.choices %}
        {% partial __SELF__ ~ '::totals' choices=__SELF__.choices %}
    {% endif %}
{% endif %}
